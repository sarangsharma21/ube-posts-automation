name: Ube Culture Instagram Auto-Poster

on:
  schedule:
    # Runs once daily at 13:30 UTC (7:00 PM IST)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (validate without publishing)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      post_id:
        description: 'Optional specific post ID (leave blank for next due post)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  publish-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Convert any new raw images to Instagram-compliant JPEG
        run: python prepare_images.py

      - name: Push newly prepared JPEGs before publishing (if any)
        run: |
          git config --global user.name "Ube Culture Auto-Poster"
          git config --global user.email "bot@ubeculture.com"
          git add posts/ready
          if ! git diff --staged --quiet; then
            git commit -m "Prepare new JPEG post assets [skip ci]"
            git push
          fi

      - name: Run Instagram Auto-Poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            if [ -n "${{ inputs.post_id }}" ]; then
              ARGS="$ARGS --post-id ${{ inputs.post_id }}"
            fi
          fi
          python publish_agent.py $ARGS

      - name: Save updated queue state
        run: |
          git config --global user.name "Ube Culture Auto-Poster"
          git config --global user.email "bot@ubeculture.com"
          git add queue.json
          git diff --staged --quiet || (git commit -m "Mark Instagram post as published [skip ci]" && git push)
